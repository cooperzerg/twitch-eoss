<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200, height=700">
<title>Valorant Skin Quiz</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  width: 1200px;
  height: 700px;
  background: transparent;
  font-family: 'Segoe UI', Arial, sans-serif;
  overflow: hidden;
  user-select: none;
}
.container {
  width: 1200px;
  height: 700px;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 10px 20px;
}
.weapon-label {
  font-size: 42px;
  font-weight: bold;
  color: #ffd966;
  text-shadow: 0 0 20px rgba(255,217,102,0.5), 2px 2px 4px rgba(0,0,0,0.8);
  margin-bottom: 4px;
}
.round-info {
  color: rgba(255,255,255,0.5);
  font-size: 16px;
  margin-bottom: 6px;
}
.timer-bar {
  width: 300px;
  height: 4px;
  background: rgba(255,255,255,0.1);
  border-radius: 2px;
  margin-bottom: 10px;
  overflow: hidden;
}
.timer-fill {
  height: 100%;
  background: linear-gradient(90deg, #ff4444, #ffd966, #44ff44);
  border-radius: 2px;
  transition: width 0.1s linear;
  width: 100%;
}
.card {
  width: 300px;
  background: rgba(20, 20, 35, 0.92);
  border: 3px solid rgba(80, 80, 120, 0.6);
  border-radius: 16px;
  padding: 10px;
}
.options {
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.option {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 6px;
  border-radius: 8px;
  background: rgba(255,255,255,0.03);
  border: 1px solid transparent;
  transition: all 0.3s ease;
}
.option.correct {
  background: rgba(68,204,136,0.15);
  border-color: #44cc88;
}
.option .label {
  background: rgba(255,217,102,0.15);
  color: #ffd966;
  font-size: 14px;
  font-weight: bold;
  width: 24px;
  height: 24px;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 4px;
}
.option .skin {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex: 1;
}
.option img {
  width: 100%;
  height: 70px;
  object-fit: contain;
  border-radius: 4px;
}
.option .name {
  color: #ffd966;
  font-size: 10px;
  font-weight: bold;
  margin-top: 2px;
  text-align: center;
}
.result-text {
  font-size: 18px;
  font-weight: bold;
  margin: 8px 0;
  text-shadow: 0 0 10px rgba(0,0,0,0.8);
  color: #ffd966;
}
.voters {
  color: rgba(255,255,255,0.7);
  font-size: 14px;
  margin-top: 6px;
  text-align: center;
}
.idle-msg {
  color: rgba(255,255,255,0.3);
  font-size: 28px;
  margin-top: 200px;
}
</style>
</head>
<body>
<div class="container" id="app">
  <div class="idle-msg">Ожидание...</div>
</div>
<audio id="sfx" preload="auto"></audio>
<script>
const app = document.getElementById('app');
const sfx = document.getElementById('sfx');
let prevState = 'idle';
let playStarted = false;

async function poll() {
  try {
    const res = await fetch('/state');
    const data = await res.json();
    if (data.state === 'playing' && prevState !== 'playing') {
      playStarted = false;
    }
    prevState = data.state;
    if (data.state === 'idle') {
      app.innerHTML = '<div class="idle-msg">Ожидание...</div>';
    } else if (data.state === 'playing') {
      renderPlaying(data);
      if (!playStarted && data.sfx_url) {
        sfx.src = data.sfx_url;
        sfx.play().catch(() => {});
        playStarted = true;
      }
    } else if (data.state === 'feedback') {
      renderFeedback(data);
    }
  } catch(e) {}
  setTimeout(poll, 300);
}

function renderPlaying(data) {
  let html = '<div class="weapon-label">' + data.weapon + '</div>';
  if (data.round && data.total_rounds) {
    html += '<div class="round-info">Раунд ' + data.round + ' из ' + data.total_rounds + '</div>';
  }
  html += '<div class="timer-bar"><div class="timer-fill"></div></div>';
  html += '<div class="card"><div class="options">';
  for (const opt of data.options) {
    html += '<div class="option">' +
      '<div class="label">' + opt.label + '</div>' +
      '<div class="skin">' +
        '<img src="' + opt.image_url + '" alt="' + opt.collection + '">' +
        '<div class="name">' + opt.collection + '</div>' +
      '</div></div>';
  }
  html += '</div></div>';
  app.innerHTML = html;
}

function renderFeedback(data) {
  let html = '<div class="weapon-label">' + data.weapon + '</div>';
  html += '<div class="result-text">Ответ: ' + data.correct_collection + '</div>';
  html += '<div class="card"><div class="options">';
  for (const opt of data.options) {
    let cls = '';
    if (opt.label === data.correct_label) cls = 'correct';
    html += '<div class="option ' + cls + '">' +
      '<div class="label">' + opt.label + '</div>' +
      '<div class="skin">' +
        '<img src="' + opt.image_url + '" alt="' + opt.collection + '">' +
        '<div class="name">' + opt.collection + '</div>' +
      '</div></div>';
  }
  html += '</div></div>';
  if (data.correct_voters && data.correct_voters.length > 0) {
    html += '<div class="voters">Угадали: ' + data.correct_voters.join(', ') + '</div>';
  } else {
    html += '<div class="voters">Никто не угадал</div>';
  }
  app.innerHTML = html;
}

poll();
</script>
</body>
</html>
